# PXF DB Extensions CI — the pull-request/push STUB for the C-extension
# lane. The jobs live in ONE place, .github/workflows/pxf-db-extensions-lane.yml
# on main, called below @main; this file only decides WHEN the lane runs
# for event-driven triggers and with WHAT token. Both main and
# release-6.x carry this stub (byte-identical unless a branch must pin a
# different WarehousePG — then it passes `with:` here, see the lane's
# inputs), and neither carries a copy of the lane.
#
# Token: read-only. pull_request runs must never be able to write, and
# a called workflow can only downgrade what its caller grants — so the
# issue-filing jobs (which never run on these events) get their
# issues: write from the OTHER stub, pxf-db-extensions-weekly.yml.
#
# Trade-off, deliberate: a PR that edits the lane file runs MAIN's lane
# against the PR's sources, not the PR's lane (the @main ref resolves to
# real main, never to the merge ref). Lane changes are trialled from a
# ci/** push with the `uses:` refs re-pointed at the branch — procedure
# in .github/workflows/README.md, "Testing a change to the lane".

name: PXF DB Extensions CI

run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('[db-extensions CI] PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title)
      || format('[db-extensions CI] {0}: {1}', github.ref_name, github.event_name) }}

on:
  pull_request:
    # A pull_request run uses the STUB from the merge ref (head merged
    # into base) and the LANE from main: a PR against release-6.x runs
    # release-6.x's stub + scripts, a PR against main runs main's — with
    # the same lane either way.
    branches: [main, release-6.x]
    paths:
      - 'fdw/**'
      - 'external-table/**'
      - 'api_version'
      - '.github/workflows/pxf-db-extensions-ci.yml'
      - '.github/workflows/pxf-db-extensions-weekly.yml'
      - '.github/workflows/pxf-db-extensions-lane.yml'
      - '.github/actions/whpg-tree-provenance/**'
      - '.github/scripts/build-whpg.bash'
      - '.github/scripts/run-db-extension-checks.bash'
      - '.github/scripts/run-db-extension-checks-gpadmin.bash'
      - '.github/scripts/pin-freshness-decide.bash'
      - '.github/scripts/pin-freshness-newest.bash'
      - '.github/scripts/test-pin-freshness-decide.bash'
  push:
    # ci/** = opt-in CI for feature branches (no PR needed). No path
    # filter here: a ci/** push is already an explicit request.
    branches: ['ci/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Stacked pushes on a cold cache would stack ~10-minute WarehousePG
  # builds; cancelling a stale PR run loses nothing because PR runs
  # never save the cache anyway.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/release-6.x' }}

jobs:
  db-extensions:
    name: db-extensions
    uses: warehouse-pg/whpg-pxf/.github/workflows/pxf-db-extensions-lane.yml@main
    # No `with:` — this branch runs the lane's default pins. To diverge
    # (e.g. release-6.x pinning an older WHPG 7), pass whpg7-tag /
    # whpg7-sha / whpg6-tag / whpg6-sha / build-image-digest here.
