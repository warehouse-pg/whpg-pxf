apply plugin: "java-library"

jar {
    enabled = true
}

dependencies {
    /*******************************
     * API Dependencies
     *******************************/

    /*******************************
     * Compile Only Dependencies
     *******************************/

    compileOnly("org.apache.hadoop:hadoop-annotations")              { transitive = false }

    /*******************************
     * Implementation Dependencies
     *******************************/

    implementation(project(':pxf-api'))
    implementation("com.google.guava:guava")
    implementation("com.zaxxer:HikariCP")
    implementation("commons-collections:commons-collections")
    implementation("commons-io:commons-io")
    implementation("commons-lang:commons-lang")
    implementation("org.postgresql:postgresql")                      { transitive = false }

    /*******************************
     * Transitive Dependencies for JDBC Hive Access
     *******************************/

    implementation("org.apache.hive:hive-jdbc")                      { transitive = false }
    implementation("org.apache.hive:hive-service")                   { transitive = false }
    implementation("org.apache.thrift:libthrift")                    { transitive = false }
    implementation("org.apache.hive:hive-common")                    { transitive = false }
    implementation("org.apache.hive.shims:hive-shims-0.23")          { transitive = false }
    implementation("org.apache.hive.shims:hive-shims-common")        { transitive = false }
    implementation("org.springframework.boot:spring-boot-starter-log4j2")

    /*******************************
     * Test Dependencies
     *******************************/

    testImplementation("org.apache.parquet:parquet-pig")
    testImplementation('org.springframework.boot:spring-boot-starter-test')
    testImplementation('org.mockito:mockito-inline')
    // Hadoop 3.3.6 split o.a.h.util.StringInterner's delegate into the shaded
    // hadoop-shaded-guava artifact. Without it on the test classpath, any test
    // that touches Hadoop Configuration loading trips with
    // NoClassDefFoundError: org/apache/hadoop/thirdparty/com/google/common/collect/Interners.
    // Same finding-shape as pxf-api / pxf-hdfs.
    testRuntimeOnly("org.apache.hadoop.thirdparty:hadoop-shaded-guava:1.2.0")
    // Hadoop 3 also depends on commons-configuration2 (formerly v1) for some
    // Configuration internals. Added preemptively to forestall a second-tier
    // failure once hadoop-shaded-guava unblocks the StringInterner cascade —
    // same two-deps-needed pattern pxf-api exposed in Phase 5 [5.9].
    testRuntimeOnly("org.apache.commons:commons-configuration2:2.8.0")
}

test {
    useJUnitPlatform()
}
