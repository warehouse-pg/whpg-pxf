version=0.0.0-SNAPSHOT
apiVersion=0
license=ASL 2.0
# Hadoop version for the CLIENT jars bundled into the PXF service jar.
# This is what ships to users; PXF talks to whatever cluster they run.
hadoopVersion=3.4.3
# Hadoop version installed on the singlecluster TEST environment. This is
# a server, not a client, and is deliberately independent of the pin above
# so the two can be moved separately -- a newer client against an older
# cluster is both supported by Hadoop and the more representative test.
#
# It is currently held at 3.3.6 because Hive 2.3.8 cannot run MapReduce
# jobs on a Hadoop 3.4.x cluster. Hive's launcher exports
# HADOOP_USER_CLASSPATH_FIRST=true, so Hive's pre-3.13 commons-lang3
# (standalone jar, plus an unrelocated copy inside hive-exec) shadows the
# 3.18.0 jar Hadoop 3.4 ships. Hive 2.3.8 ships no commons-text of its
# own, so that one loads from Hadoop's lib dir -- and Hadoop 3.4 upgraded
# it to 1.14, whose NumericEntityEscaper calls Range.of(), added in
# commons-lang3 3.13. New escaper + old shadowed Range = NoSuchMethodError
# on every MR job submission. Hadoop 3.3.6 ships commons-text 1.10, which
# still calls Range.between() -- that is why the current pairing works.
# The L2 Hive suite depends on MapReduce via INSERT ... SELECT, so the
# test cluster cannot follow the client past 3.3.x until Hive moves
# (Hive 4.x ships a consistent lang3 + commons-text pair of its own and
# tolerates a Hadoop 3.4 cluster).
#
# Do NOT collapse these two keys back into one. Raising hadoopVersion used
# to silently re-provision the test cluster as well, which is exactly how
# that breakage was introduced.
singleclusterHadoopVersion=3.3.6
hiveVersion=2.3.8
hiveStorageApiVersion=2.7.2
hbaseVersion=2.6.5
zookeeperVersion=3.8.6
junitVersion=4.11
parquetVersion=1.11.1
awsJavaSdk=1.12.261
# AWS SDK v2, required by hadoop-aws 3.4.x's S3AFileSystem. Track the
# aws-java-sdk-v2.version property of the matching hadoop-project pom.
awsJavaSdkV2=2.35.4
# S3 analytics accelerator, required by hadoop-aws 3.4.x. Track the
# amazon-s3-analyticsaccelerator-s3.version property of the matching
# hadoop-project pom.
analyticsAcceleratorVersion=1.3.1
springBootVersion=2.7.18
org.gradle.daemon=true
org.gradle.parallel=false
orcVersion=1.6.13
