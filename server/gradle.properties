version=0.0.0-SNAPSHOT
apiVersion=0
license=ASL 2.0
# Hadoop version for the CLIENT jars bundled into the PXF service jar and
# for the Hadoop service installed on the singlecluster TEST environment.
# The two briefly moved separately (via a singleclusterHadoopVersion key)
# while the singlecluster's Hive 2.3.8 could not run MapReduce on a
# Hadoop 3.4.x cluster; with the singlecluster's Hive at 4.x (see
# singleclusterHiveVersion below) that blocker is gone and the pins move
# in lockstep again. Should they ever need to diverge, re-introduce the
# split key (singleclusterHadoopVersion) here AND change
# singlecluster/tools/downloadApache.sh back to reading it instead of
# hadoopVersion -- there is no fallback between the two keys; only one
# is ever read.
hadoopVersion=3.4.3
hiveVersion=4.0.1
# Hive version installed on the singlecluster TEST environment. This is a
# server, not a client: hiveVersion above pins the client jars PXF compiles
# against and ships, while this key provisions the Hive service the tests
# run AGAINST. They are deliberately independent. A newer server under an
# older client is the direction real deployments skew, and an explicit
# server-side pin also lets a compatibility lane hold the server at an
# older release when the client eventually moves.
#
# 4.0.1 rather than 4.1.x because 4.0.1 is the newest line that still
# targets Java 8 class files (4.1.0 requires JDK 17). Unlike Hive 2.3.8,
# Hive 4.x ships a consistent commons-lang3 + commons-text pair of its
# own, which is what allows the singlecluster's Hadoop to be 3.4.x --
# Hive 2.3.8 fails every MapReduce submission on a Hadoop 3.4 cluster
# with NoSuchMethodError on commons-lang3 Range.of (Hive's launcher
# forces its own stale commons-lang3 ahead of Hadoop's, while Hadoop
# 3.4's commons-text 1.14 needs commons-lang3 3.13+).
singleclusterHiveVersion=4.0.1
hiveStorageApiVersion=4.0.1
hbaseVersion=2.6.5
zookeeperVersion=3.8.6
junitVersion=4.11
parquetVersion=1.11.1
awsJavaSdk=1.12.261
# AWS SDK v2, required by hadoop-aws 3.4.x's S3AFileSystem. Track the
# aws-java-sdk-v2.version property of the matching hadoop-project pom.
awsJavaSdkV2=2.35.4
# S3 analytics accelerator, required by hadoop-aws 3.4.x. Track the
# amazon-s3-analyticsaccelerator-s3.version property of the matching
# hadoop-project pom.
analyticsAcceleratorVersion=1.3.1
springBootVersion=2.7.18
org.gradle.daemon=true
org.gradle.parallel=false
# ORC. Hive 4.0.1's own POM pins <orc.version>1.8.5</orc.version>; this sits a
# few patches above it, staying inside the same minor line. 1.8.5 is reported
# against CVE-2025-47436, fixed in 1.8.9. That advisory is a heap buffer
# overflow in the ORC *C++* LZO decompressor and PXF bundles only the pure-Java
# orc-core/orc-shims jars (verified: no .so/.dylib/.dll inside them), so the
# shipped bundle was never exposed -- but the patch line is free, Java 8 class
# files throughout, and identical in class count to 1.8.5, so taking the fix is
# cheaper than arguing about it. Do NOT jump to 2.x: orc-core 2.x is compiled
# for Java 17 (class-file major 61).
orcVersion=1.8.10
