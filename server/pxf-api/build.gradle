apply plugin: "java-library"

jar {
    enabled = true
}

dependencies {

    /*******************************
     * Annotation Processors
     *******************************/

    annotationProcessor("org.springframework.boot:spring-boot-autoconfigure-processor")
    annotationProcessor("org.springframework.boot:spring-boot-configuration-processor")

    /*******************************
     * API Dependencies
     *******************************/

    api("org.apache.hadoop:hadoop-common")                           { transitive = false }
    api("org.springframework.boot:spring-boot-starter")
    api('org.springframework.boot:spring-boot-starter-web')

    /*******************************
     * Compile Only Dependencies
     *******************************/

    compileOnly("org.apache.hadoop:hadoop-annotations")

    /*******************************
     * Implementation Dependencies
     *******************************/

    implementation("org.springframework.boot:spring-boot-starter-log4j2")

    implementation("com.google.guava:guava")
    implementation("commons-codec:commons-codec")
    implementation("commons-collections:commons-collections")
    implementation("commons-configuration:commons-configuration")
    implementation("commons-lang:commons-lang")
    implementation("org.apache.commons:commons-lang3")

    implementation("org.apache.hadoop:hadoop-auth")                  { transitive = false }
    implementation("org.codehaus.woodstox:stax2-api")                { transitive = false }
    implementation("com.fasterxml.woodstox:woodstox-core")           { transitive = false }
    implementation("com.esotericsoftware:kryo")                      { transitive = false }

    /*******************************
     * Test Dependencies
     *******************************/

    testCompileOnly("org.apache.hadoop:hadoop-annotations")
    testImplementation("com.esotericsoftware:minlog")
    testImplementation("com.esotericsoftware:reflectasm")
    testImplementation('org.mockito:mockito-inline')
    testImplementation('org.springframework.boot:spring-boot-starter-test')
    // pxf-api's hadoop-common is declared
    // { transitive = false } on line 20, so Hadoop 3.3.6's split runtime
    // helpers don't come along. PxfUserGroupInformationTest exercises
    // Configuration.set() → loadResource() → Parser.handleEndElement() →
    // StringInterner.<clinit>, which delegates to
    // org.apache.hadoop.thirdparty.com.google.common.collect.Interners
    // from the hadoop-shaded-guava artifact. Without it on the TEST
    // classpath, StringInterner's static init throws — and every
    // subsequent attempt to touch Hadoop Configuration / UGI fails with
    // "NoClassDefFoundError: Could not initialize class
    // org.apache.hadoop.security.UserGroupInformation" (because UGI's
    // own clinit depends on Configuration which depends on
    // StringInterner). 64/417 tests in pxf-api failed today; the
    // single dep below closes the gate. Same finding-shape as the
    // pxf-hdfs runtime and pxf-hbase test classpath holes; all three
    // modules now mirror the same fix.
    testRuntimeOnly("org.apache.hadoop.thirdparty:hadoop-shaded-guava:1.2.0")
    // Second-layer fix: SecureLoginTest exercises Hadoop 3.x
    // Configuration that internally depends on commons-configuration2's
    // o.a.commons.configuration2.Configuration interface (Hadoop 3 split
    // off commons-configuration 1.x). Missing on the TEST classpath
    // causes a NoClassDefFoundError that cascades — once one test
    // poisons UGI's static init, the remaining 40 fail. Same artifact
    // + version pinned in pxf-hdfs/build.gradle.
    testRuntimeOnly("org.apache.commons:commons-configuration2:2.8.0")
}

test {
    useJUnitPlatform()
}
