apply plugin: "java-library"

jar {
    enabled = true
}

dependencies {
    /*******************************
     * API Dependencies
     *******************************/

    /*******************************
     * Compile Only Dependencies
     *******************************/

    compileOnly("org.apache.hadoop:hadoop-annotations")              { transitive = false }
    // the Hive 4.x metastore client classes carry Hadoop's classification
    // annotations; javac -Werror needs them resolvable at test compile too
    testCompileOnly("org.apache.hadoop:hadoop-annotations")          { transitive = false }

    /*******************************
     * Implementation Dependencies
     *******************************/

    implementation(project(':pxf-api'))
    implementation(project(':pxf-hdfs'))
    implementation("org.springframework.boot:spring-boot-starter-log4j2")

    implementation("com.google.guava:guava")
    implementation("commons-codec:commons-codec")
    implementation("commons-lang:commons-lang")
    implementation("org.apache.hive:hive-exec:${hiveVersion}:core")  { transitive = false }
    implementation("org.apache.hive:hive-metastore")                 { transitive = false }
    implementation("org.apache.hive:hive-serde")                     { transitive = false }
    implementation("com.esotericsoftware:kryo")                      { transitive = false }

    /*******************************
     * Transitive dependencies for hive-exec-core. Instead of bundling
     * hive-exec, hive-exec-core is used to avoid conflict with other
     * dependencies included in hive-exec (i.e Parquet) which were causing
     * other tests to fail.
     *******************************/

    implementation("org.apache.hive:hive-common")                    { transitive = false }
    // Artifacts new to this block with the Hive 4.x tree (the splits
    // happened upstream in Hive 2.1-4.0): the metastore thrift client
    // classes live in hive-standalone-metastore-common, the
    // HiveServer2/TCLIService RPC types in hive-service-rpc, and the
    // InterfaceAudience annotations in hive-classification
    implementation("org.apache.hive:hive-standalone-metastore-common") { transitive = false }
    implementation("org.apache.hive:hive-service-rpc")               { transitive = false }
    implementation("org.apache.hive:hive-classification")            { transitive = false }
    implementation("org.apache.hive:hive-udf")                       { transitive = false }
    // the Hive 4.x metastore client can speak thrift-over-HTTP and
    // references the Apache HttpClient API at class-load time
    implementation("org.apache.httpcomponents:httpclient")           { transitive = false }
    implementation("org.apache.httpcomponents:httpcore")             { transitive = false }
    implementation("org.apache.hive.shims:hive-shims-common")        { transitive = false }
    implementation("org.apache.hive.shims:hive-shims-0.23")          { transitive = false }
    implementation("org.apache.commons:commons-lang3")               { transitive = false }
    implementation("org.apache.hive:hive-storage-api")               { transitive = false }
    implementation("org.apache.orc:orc-core")                        { transitive = false }
    // a declared runtime dependency of orc-core (already bundled for the
    // hdfs:orc profile via pxf-hdfs; declared here too so the hive plugin's
    // ORC path does not depend on module ordering)
    implementation("org.threeten:threeten-extra")                    { transitive = false }
    implementation("io.airlift:aircompressor")                       { transitive = false }
    implementation("joda-time:joda-time")                            { transitive = false }
    implementation("org.objenesis:objenesis")                        { transitive = false }
    implementation("com.esotericsoftware:kryo")                      { transitive = false }
    implementation("com.esotericsoftware:minlog")                    { transitive = false }
    implementation("com.esotericsoftware:reflectasm")                { transitive = false }
    implementation("org.apache.thrift:libfb303")                     { transitive = false }
    implementation("org.apache.thrift:libthrift")                    { transitive = false }
    implementation("org.antlr:antlr-runtime")                        { transitive = false }
    implementation("org.xerial.snappy:snappy-java")                  { transitive = false }
    // hive-common 4.x reads JSON through com.tdunning:json. This jar and
    // org.json:json below (kept for MapR, see its own comment) both ship
    // classes under the same org.json.* package names (JSONObject,
    // JSONArray, JSONException, JSONTokener, etc.) with different
    // implementations -- verified by listing both jars' contents.
    // Whichever one the classpath happens to load first wins for any
    // caller of those classes; this repo's own code doesn't reference
    // org.json.* directly, so nothing here is currently affected, but a
    // future direct usage should be aware of the collision.
    implementation("com.tdunning:json")                              { transitive = false }
    implementation("org.jodd:jodd-util")                             { transitive = false }

    // transitive dependency for reading Hive tables with SerDe 'org.apache.hadoop.hive.serde2.OpenCSVSerde'
    implementation("net.sf.opencsv:opencsv")                         { transitive = false }

    // transitive dependency required by MapR
    implementation("org.json:json:20090211")                         { transitive = false }

    /*******************************
     * Test Dependencies
     *******************************/

    testImplementation('org.springframework.boot:spring-boot-starter-test')
    testImplementation('org.mockito:mockito-inline')
}

test {
    useJUnitPlatform()
}
