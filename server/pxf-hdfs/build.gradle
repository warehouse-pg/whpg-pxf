apply plugin: "java-library"

jar {
    enabled = true
}

dependencies {
    /*******************************
     * API Dependencies
     *******************************/

    api(project(':pxf-api'))
    api("org.apache.hadoop:hadoop-mapreduce-client-core") { transitive = false }

    /*******************************
     * Compile Only Dependencies
     *******************************/

    compileOnly("org.apache.hadoop:hadoop-annotations")              { transitive = false }

    /*******************************
     * Implementation Dependencies
     *******************************/

    implementation("com.google.guava:guava")
    implementation("commons-codec:commons-codec")
    implementation("commons-configuration:commons-configuration")
    implementation("commons-io:commons-io")
    implementation("commons-lang:commons-lang")
    implementation("org.apache.commons:commons-lang3")
    implementation("org.slf4j:slf4j-api")

    implementation("org.apache.avro:avro-mapred")                    { transitive = false }
    implementation("org.apache.hadoop:hadoop-yarn-api")              { transitive = false } // Kerberos dependency
    implementation("org.apache.hadoop:hadoop-yarn-client")           { transitive = false } // Kerberos dependency
    implementation("org.apache.hadoop:hadoop-common")                { transitive = false }
    // Hadoop 3.3.x references org.apache.hadoop.thirdparty.com.google.common.collect.Interners
    // from o.a.h.util.StringInterner's static initializer. Without this artifact, StringInterner
    // fails to initialize at runtime -> "Could not initialize class org.apache.hadoop.util.StringInterner"
    // when any PXF Hadoop code path executes.
    implementation("org.apache.hadoop.thirdparty:hadoop-shaded-guava:1.2.0") { transitive = false }
    // Hadoop 3.3.x also shades protobuf under org.apache.hadoop.thirdparty.protobuf.*
    // (formerly relied on the unshaded com.google.protobuf in 2.x). The IPC layer
    // — used by DFSClient and every other Hadoop RPC consumer — references the
    // shaded Message class from a static initializer. Without this artifact,
    // any PXF read from HDFS trips with
    //   "PXF server error : java.lang.NoClassDefFoundError:
    //    org/apache/hadoop/thirdparty/protobuf/Message"
    // on the very first profile=hdfs:* query. Surfaced by the packaging
    // smoke run (hdfs:csv profile).
    // Version pinned to 1.1.1 to match Hadoop 3.3.6's own hadoop-project pom
    // (<hadoop-thirdparty.version>1.1.1</hadoop-thirdparty.version>) — that's
    // what Hadoop itself would resolve transitively when shipped to a real
    // node. Same finding-shape as hadoop-shaded-guava above.
    implementation("org.apache.hadoop.thirdparty:hadoop-shaded-protobuf_3_7:1.1.1") { transitive = false }
    // Hadoop 3.3.6's hadoop-common pulls com.google.re2j (a Java port of
    // Google's RE2 regex engine) for FileSystem glob path matching. We
    // already have re2j on the testRuntimeOnly classpath for pxf-hdfs /
    // pxf-json tests, but the production fat-jar was missing it because
    // hadoop-common is declared with { transitive = false }. As soon as a
    // PXF query's FileSystem path resolution hits a glob (or any code path
    // that pre-loads PatternSyntaxException), runtime trips with
    //   "PXF server error : java.lang.NoClassDefFoundError:
    //    com/google/re2j/PatternSyntaxException"
    // Surfaced by the packaging smoke run (csv profile, post-protobuf-fix).
    // Version pinned to 1.1 to match Hadoop 3.3.6's parent pom
    // (<re2j.version>1.1</re2j.version>) — that's what Hadoop ships in
    // /opt/hadoop/share/hadoop/common/lib/re2j-1.1.jar on a real node.
    // Same finding-shape as hadoop-shaded-protobuf above.
    implementation("com.google.re2j:re2j:1.1") { transitive = false }
    // Hadoop 3.x's Configuration parser uses
    // org.apache.commons.text.StringLookupFactory to expand ${var}
    // interpolations in core-site.xml / hdfs-site.xml / hbase-site.xml.
    // Without this artifact, the first PXF query that triggers
    // Configuration loading trips with
    //   "PXF server error : org/apache/commons/text/lookup/StringLookupFactory"
    // Surfaced by the packaging smoke run (csv profile, post-re2j fix).
    // Version pinned to 1.10.0 to match Hadoop 3.3.6's parent pom
    // (<commons-text.version>1.10.0</commons-text.version>) — same JAR
    // Hadoop ships in /opt/hadoop/share/hadoop/common/lib/commons-text-1.10.0.jar.
    // Same finding-shape as re2j above.
    implementation("org.apache.commons:commons-text:1.10.0") { transitive = false }
    // Hadoop 3.x bumped commons-configuration from v1 → v2 (different group/artifact).
    // The old commons-configuration:1.10 is still bundled but Hadoop 3.3.6 internals
    // reference org.apache.commons.configuration2.Configuration. Without this dep,
    // PXF errors at runtime with "PXF server error : org/apache/commons/configuration2/Configuration"
    // on any Hadoop-touching code path.
    implementation("org.apache.commons:commons-configuration2:2.8.0") { transitive = false }
    implementation("org.apache.hadoop:hadoop-hdfs")                  { transitive = false }
    implementation("org.apache.hadoop:hadoop-hdfs-client")           { transitive = false }
    implementation("org.apache.parquet:parquet-format")              { transitive = false }
    implementation("org.apache.parquet:parquet-column")              { transitive = false }
    implementation("org.apache.parquet:parquet-common")              { transitive = false }
    implementation("org.apache.parquet:parquet-encoding")            { transitive = false }
    implementation("org.apache.parquet:parquet-generator")           { transitive = false }
    implementation("org.apache.parquet:parquet-hadoop")              { transitive = false }
    implementation("org.apache.parquet:parquet-jackson")             { transitive = false }
    implementation("org.apache.hive:hive-storage-api")               { transitive = false } // for parquet writing

    implementation("org.codehaus.jackson:jackson-core-asl")          { transitive = false }
    implementation("org.codehaus.jackson:jackson-mapper-asl")        { transitive = false }

    implementation("org.apache.avro:avro")                           { transitive = false }

    // Dependencies for writing Avro files with compression
    implementation("org.apache.commons:commons-compress")            { transitive = false }
    implementation("org.tukaani:xz")                                 { transitive = false }

    // Hadoop uses the log4j 1.x API; we bridge it to our log4j2 backend with
    // log4j-1.2-api (MDC calls map to log4j2 ThreadContext, same as slf4j MDC).
    // Do NOT use org.slf4j:log4j-over-slf4j here: its org.apache.log4j.Log4jLoggerFactory
    // marker class trips the slf4j-log4j12 delegation-loop check inside third-party JDBC
    // drivers that shade slf4j-log4j12 (e.g. Cloudera Impala JDBC), causing
    // ExceptionInInitializerError on first connection.
    implementation("org.apache.logging.log4j:log4j-1.2-api")         { transitive = false }

    // Dependency in hadoop 2.10.1
    implementation("com.fasterxml.woodstox:woodstox-core")           { transitive = false }
    implementation("org.codehaus.woodstox:stax2-api")                { transitive = false }

    // ORC dependencies
    implementation("org.apache.orc:orc-core")                        { transitive = false }
    implementation("org.apache.orc:orc-shims")                       { transitive = false }
    implementation("org.apache.hive:hive-common")                    { transitive = false }
    implementation("com.google.protobuf:protobuf-java")              { transitive = false }
    implementation("org.threeten:threeten-extra")                    { transitive = false }

    /*******************************
     * Dependencies for Supported Hadoop-Compatible Filesystems
     *******************************/

    // Azure Data Blob
    implementation("org.apache.hadoop:hadoop-azure")                 { transitive = false }
    implementation("com.microsoft.azure:azure-storage")              { transitive = false }

    // Azure Datalake jars
    implementation("org.apache.hadoop:hadoop-azure-datalake")        { transitive = false }
    implementation("com.microsoft.azure:azure-data-lake-store-sdk")  { transitive = false }
    implementation("org.wildfly.openssl:wildfly-openssl")            { transitive = false }
    implementation("org.mortbay.jetty:jetty-util")                   { transitive = false }

    // GCS jars and dependencies
    implementation("com.google.cloud.bigdataoss:gcs-connector:hadoop2-1.9.17:shaded")
                                                                     { transitive = false }

    /*******************************
     * Test Dependencies
     *******************************/

    testCompileOnly("org.apache.hadoop:hadoop-annotations")

    testImplementation("io.airlift:aircompressor")       // for HcfsTypeTest for testing write URI with LzopCodec
    testImplementation("org.apache.parquet:parquet-pig") // for parquet tests
    testImplementation('org.springframework.boot:spring-boot-starter-test')
    // Hadoop 3.3.6's hadoop-common pulls com.google.re2j:re2j (a Java port of
    // Google's RE2 regex engine) for glob path matching in FileSystem
    // implementations. Since pxf-hdfs depends on hadoop-common with
    // { transitive = false }, re2j doesn't come along — and any test that
    // exercises a FileSystem glob path (HdfsDataFragmenterTest +
    // HdfsFileFragmenterTest, ~10 tests) trips with
    // NoClassDefFoundError: com/google/re2j/PatternSyntaxException.
    // Hadoop 3.3.6's parent pom pins re2j to 1.1 — match that version
    // so the test classpath sees the same artifact the production runtime
    // would resolve transitively when hadoop-common is shipped to a real
    // node. Surfaced 2026-05-28 by the first packaging-CI dispatch.
    testRuntimeOnly("com.google.re2j:re2j:1.1")
}

test {
    useJUnitPlatform()
}
