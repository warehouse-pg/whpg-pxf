buildscript {
    repositories {
        mavenCentral()
    }
}

plugins {
    id "io.franzbecker.gradle-lombok" version "3.3.0"
    id "org.springframework.boot" version "${springBootVersion}" apply false
    id 'io.spring.dependency-management' version '1.0.11.RELEASE'
}

// override Spring Framework version: the Boot 2.7 BOM itself only manages 5.3.31.
// 5.3.39 is the last version published to Maven Central before free/OSS security
// support for the 5.3.x line ended 2024-08-31 (later fixes are commercial-only,
// not resolvable from this build). It still includes the async race condition
// fix (https://github.com/spring-projects/spring-framework/issues/32342, landed
// in 5.3.33) plus everything patched through the OSS support window.
ext['spring-framework.version'] = '5.3.39'
// embedded Tomcat: 9.0.121 is the current 9.0.x release with no
// published advisories (the previous 9.0.87 accumulated several);
// Tomcat 9 stays on the Java 8 / javax.servlet baseline.
ext['tomcat.version'] = '9.0.121'
// jackson: the Boot 2.7 BOM manages 2.13.5, which carries published
// advisories; 2.22.2 is the current 2.x release with none, still Java 8
// class files. Overridden via the jackson-bom property so core,
// databind, annotations, datatypes and modules all move together.
ext['jackson-bom.version'] = '2.22.2'
// log4j2: the Boot 2.7 BOM manages 2.17.2, which carries five published
// advisories (CVE-2025-68161, CVE-2026-34477, CVE-2026-34479,
// CVE-2026-34480, CVE-2026-34481 -- TLS hostname verification on the
// Socket Appender, plus XmlLayout / Log4j1XmlLayout / JsonTemplateLayout
// output-integrity issues). OSV puts the last of those fixed at 2.25.4.
// 2.26.0 then picked up CVE-2026-49844 of its own (improper serialization
// of non-finite floating-point values in MapMessage.asJson(), in
// log4j-api): OSV lists 2.26.0 as affected and 2.26.1 as not, so the
// floor is 2.26.1. Class-file levels are unchanged from 2.26.0 (1252 of
// 1253 log4j-core classes are Java 8, with the same single Java 9 class
// and the same multi-release entries). Overridden via the log4j2
// property so api, core, the JUL adapter, the SLF4J binding, the 1.x
// compatibility API and log4j-spring-boot all move together.
ext['log4j2.version'] = '2.26.1'

def javaProjects = subprojects.findAll {
    it.name.startsWith("pxf-")
}

allprojects {
    apply plugin: "jacoco"
    apply plugin: "idea"
    apply plugin: "eclipse"

    repositories {
        mavenCentral()
    }
}

idea {
    project {
        jdkName = "1.8"
        languageLevel = "8"
        vcs = "Git"
    }
}

configure(javaProjects) {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: "io.franzbecker.gradle-lombok"

    group = 'org.greenplum.pxf'
    version = "${version}"

    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8

    // The Spring Boot 2.7 BOM manages snakeyaml at 1.30, which carries
    // published advisories fixed only in the 2.x line. Boot 2.7.13+
    // supports SnakeYAML 2.x at runtime.
    ext['snakeyaml.version'] = '2.5'

    // Without this override the Spring Boot 2.7 BOM would downgrade netty
    // to 4.1.101.Final (Nov 2023) on the netty-nio-client runtime path that
    // S3AFileSystem's async client uses, reintroducing since-fixed CVEs.
    // 4.1.137 goes deliberately ABOVE the AWS SDK v2 (2.35.4) pin of
    // 4.1.126: the 2025-26 netty advisory wave (28 GHSAs against 4.1.126,
    // 13 rated high) is only fully fixed at 4.1.137, and netty 4.1.x
    // patch releases are drop-in for the SDK's usage.
    ext['netty.version'] = '4.1.137.Final'

    dependencyManagement {
        imports {
            mavenBom("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
        }
        dependencies {
            // Kryo family per Hive 4.0.1's POM (kryo 5.5.0's own dependency
            // versions for objenesis/minlog/reflectasm)
            dependency("com.esotericsoftware:kryo:5.5.0")
            dependency("com.esotericsoftware:minlog:1.3.1")
            dependency("com.esotericsoftware:reflectasm:1.11.9")
            // woodstox-core 6.x is the maintained line; Hive 4.0.1's own POM
            // pin (5.0.3) carries published advisories (fixed in 5.4.0/6.4.0).
            // stax2-api 4.2.x is the pairing 6.x requires (below).
            dependency("com.fasterxml.woodstox:woodstox-core:6.7.0")
            dependency("com.google.code.findbugs:annotations:1.3.9")
            // Overrides Hive 2.3.8's own guava.version pin (14.0.1, which
            // itself was already being overridden here at 20.0 -- both carry
            // published CVEs). 32.0.1-jre matches hadoop-project-3.4.3.pom's
            // own <guava.version>, so it's already exercised by the
            // hadoop-common/hdfs stack PXF links against.
            dependency("com.google.guava:guava:32.0.1-jre")
            // orc-core 1.8.x generates OrcProto with protoc 3.x, so it needs
            // a protobuf-java 3.x runtime on the classpath (the previous
            // 2.5.0 pin satisfied orc-core 1.6). Still proto2-compatible; the
            // HBase legacy-PB paths are covered by the L2 hbase group.
            //
            // Deliberately ABOVE Hive 4.0.1's own pin of 3.24.4, which carries
            // CVE-2024-7254 (8.7 high: unbounded recursion parsing nested
            // groups / SGROUP tags -> StackOverflowError). OSV puts the fix at
            // 3.25.5 for the 3.x line, so no 3.24.x release resolves it.
            // 3.25.8 is the current 3.25.x patch and it also aligns the
            // unshaded runtime with the protobuf major Hadoop 3.4.3 itself
            // shades (hadoop-shaded-protobuf_3_25). protobuf-java 3.x patch
            // releases are wire- and API-compatible, so Hive/HBase/ORC keep
            // working against it.
            dependency("com.google.protobuf:protobuf-java:3.25.8")
            // Hive 4.0.1's replacement for org.json in hive-common
            dependency("com.tdunning:json:1.8")
            dependency("com.google.cloud.bigdataoss:gcs-connector:hadoop2-1.9.17")
            dependency("com.microsoft.azure:azure-storage:5.5.0")
            dependency("com.microsoft.azure:azure-data-lake-store-sdk:2.3.9")
            dependency("com.univocity:univocity-parsers:2.9.1")
            dependency("com.yammer.metrics:metrics-core:2.2.0")
            dependency("com.zaxxer:HikariCP:3.4.5")
            dependency("commons-codec:commons-codec:1.14")
            dependency("commons-collections:commons-collections:3.2.2")
            // commons-io 2.7 carried CVE-2024-47554 (uncontrolled resource
            // consumption in XmlStreamReader), fixed in 2.14.0. This pin used
            // to sit at 2.16.1 -- hadoop-project-3.4.3.pom's own
            // <commons-io.version> -- deliberately, so it landed on the JAR
            // the Hadoop client stack already exercises.
            //
            // It has to leave that pin now, and not for a security reason:
            // commons-configuration2 2.15.x (see its own note below, bumped
            // for CVE-2026-45205) builds its file-location strategies on
            // org.apache.commons.io.build.AbstractSupplier, whose
            // IOSupplier.getUnchecked() default method only exists from
            // commons-io 2.17.0. Against 2.16.1 the pairing compiles and unit
            // tests fine, then dies at runtime the first time Hadoop resolves
            // a configuration file:
            //   NoSuchMethodError: org.apache.commons.configuration2.io
            //     .HomeDirectoryLocationStrategy$Builder.getUnchecked()
            // caught by the L2 parquet smoke test, not by anything local.
            //
            // 2.20.0 is the current release; every class is still Java 8 and
            // all 11 commons-io symbols hadoop-common 3.4.3 references resolve
            // against it. If commons-configuration2 is ever reverted to a
            // 2.10.x line, this can go back to matching Hadoop.
            dependency("commons-io:commons-io:2.20.0")
            // No commons-lang (2.x) entry: the pre-lang3 groupId is gone.
            // commons-lang 2.6 (2011) is the final release of that line and
            // carries BDSA-2025-6881 with no 2.x fix -- upstream's answer is
            // commons-lang3, so every PXF usage moved to org.apache.commons
            // .lang3 (already pinned below at 3.18.0, which is itself the
            // version that fixes that advisory). The exclude in the
            // configurations block keeps it from returning transitively.
            dependency("commons-logging:commons-logging:1.1.3")

            // The next five are declared (transitive=false) by several
            // modules and their versions live only here. All but
            // commons-configuration2 track hadoop-project-3.4.3.pom in
            // lockstep with hadoopVersion -- see that one's own note below
            // for why it is deliberately ahead.
            dependency("org.apache.commons:commons-text:1.14.0")
            // commons-text 1.14.0's escaper classes call commons-lang3
            // Range.of(), which only exists from lang3 3.13; the Spring Boot
            // 2.7 BOM would resolve 3.12.0 and poison the first
            // StringEscapeUtils class-init (reachable via Hadoop
            // MetricsConfig -> commons-configuration2 PropertiesConfiguration)
            // with NoSuchMethodError. 3.18.0 is the lang3 version
            // hadoop-project-3.4.3.pom itself pairs with text 1.14.0.
            dependency("org.apache.commons:commons-lang3:3.18.0")
            // Deliberately ahead of hadoop-project-3.4.3.pom's own pin of
            // 2.10.1, which carries CVE-2026-45205 (StackOverflowError on
            // YAML input containing cycles). Upstream fixed it in 2.15.0 and
            // states 2.2 through 2.14.x are affected, so no 2.10.x release
            // resolves it; 2.15.1 is the current patch of the fixed line and
            // is still Java 8 class files.
            //
            // This is the same jar the commons-text/lang3 note above describes
            // going wrong, and it went wrong again here. The 2.15.x line moved
            // its file-location strategies onto commons-io's
            // build.AbstractSupplier: FileLocatorUtils calls
            // HomeDirectoryLocationStrategy$Builder.getUnchecked(), inherited
            // from commons-io's IOSupplier, which only has that method from
            // 2.17.0. Against the previous commons-io 2.16.1 pin this compiled
            // and passed every unit test, then threw NoSuchMethodError on the
            // first Hadoop configuration-file resolution. Only the L2 parquet
            // smoke test caught it -- see the commons-io pin above, which had
            // to leave Hadoop's version because of this.
            //
            // Bumping anything in this cluster (commons-configuration2,
            // commons-io, commons-lang3, commons-text) needs a real runtime
            // exercise of a Hadoop config path, not unit tests and not
            // bytecode reference-resolution: an earlier attempt to verify this
            // statically reported "all references resolve" for BOTH the broken
            // and the working pairing, because a supertype walk that reaches
            // java.lang.Object cannot conclude anything.
            dependency("org.apache.commons:commons-configuration2:2.15.1")
            dependency("org.apache.commons:commons-collections4:4.4")
            dependencySet(group:"org.apache.hadoop.thirdparty", version:"1.5.0") {
                entry("hadoop-shaded-guava")
                entry("hadoop-shaded-protobuf_3_25")
            }
            // aircompressor 2.x is the latest Java-8-compatible line
            // (<air.java.version>1.8</air.java.version>; 3.x requires Java
            // 11+). 2.0.3 fixes both GHSA-973x-65j7-xcf4 (JVM crash / memory
            // leak, fixed 0.27) and GHSA-vx9q-rhv9-3jvg (Snappy/LZ4
            // output-buffer info leak, fixed 2.0.3) -- orc-core 1.8.5's own
            // pom pins this GAV to 0.21, itself vulnerable to both; this
            // stays a version override of that same coordinate, no
            // groupId/artifactId change.
            dependency("io.airlift:aircompressor:2.0.3")
            dependency("joda-time:joda-time:2.9.9")
            dependency("net.sf.opencsv:opencsv:2.3")
            dependency("org.antlr:antlr-runtime:3.5.2")
            dependency("org.apache.commons:commons-compress:1.28.0")

            dependency("org.apache.zookeeper:zookeeper:${zookeeperVersion}")
            // ZK 3.6+ split wire-protocol serialization classes into zookeeper-jute.
            // Without this on runtime classpath, ZK client times out at wire layer.
            dependency("org.apache.zookeeper:zookeeper-jute:${zookeeperVersion}")
            // stax2-api 4.2.x is the pairing woodstox-core 6.x requires
            // (above); Hive 4.0.1's own POM pins the older 3.1.4.
            dependency("org.codehaus.woodstox:stax2-api:4.2.2")
            // Hive 4.0.1 moved from jodd-core to jodd-util; the datanucleus
            // JDO persistence jars the old hive-metastore artifact pulled in
            // are gone from the Hive 4.0.1 tree (dropped, not replaced).
            dependency("org.jodd:jodd-util:6.0.0")
            // No org.json:json entry: the 20090211 release that used to be
            // pinned here (and declared by pxf-hive as a MapR companion jar)
            // is gone. It was the oldest artifact in the tree -- a 2009
            // snapshot of the reference implementation, unmaintained under
            // that coordinate for years and carrying Black Duck findings
            // with no fix in its own line. Nothing in this repo imports
            // org.json.*, PXF ships no MapR client jars for it to pair
            // with, and Hive 4.0.1 reads JSON through com.tdunning:json
            // (above), which supplies the same org.json.* class names --
            // so the two jars were shadowing each other's classes on every
            // classpath that had both. Should a MapR deployment ever need
            // the reference implementation back, it belongs in that
            // deployment's own classpath, not in the PXF RPM.
            dependency("org.objenesis:objenesis:3.3")

            // Overrides the older release the Boot 2.7 BOM manages (the pin
            // predates this bump; see git history for the original note).
            // 42.7.2 carries CVE-2026-42198 / GHSA-98qh-xjc8-98pq: unbounded
            // PBKDF2 iterations in SCRAM authentication let a hostile server
            // drive CPU exhaustion on the client. Fixed in 42.7.11; 42.7.13
            // is the current 42.7.x patch.
            dependency("org.postgresql:postgresql:42.7.13")

            dependency("org.simplify4u:slf4j-mock:2.3.0")
            dependency("org.threeten:threeten-extra:1.7.1")
            dependency("org.tukaani:xz:1.8")
            // wildfly-openssl 1.0.7.Final carries BDSA-2020-3250 (memory leak
            // on HTTP session creation -> DoS), fixed in 1.0.11.Final and
            // 1.1.3.Final. 2.2.5.Final goes past both because it is what
            // hadoop-project-3.4.3.pom itself pins, so it is the release the
            // hadoop-aws S3A openssl channel mode is built and tested
            // against. Still Java 8 class files, and the 2.x artifact is a
            // shaded uber-jar that carries wildfly-openssl-java plus the
            // per-platform natives inside it -- so the transitive = false
            // declaration in pxf-hdfs still ships a complete library, and
            // org.wildfly.openssl.OpenSSLProvider (the class Hadoop
            // registers) is present.
            dependency("org.wildfly.openssl:wildfly-openssl:2.2.5.Final")
            dependency("org.xerial.snappy:snappy-java:1.1.10.4")

            // Hadoop dependencies
            dependencySet(group:"org.apache.hadoop", version:"${hadoopVersion}") {
                entry("hadoop-annotations")
                entry("hadoop-auth")
                entry("hadoop-aws")
                entry("hadoop-azure")
                entry("hadoop-azure-datalake")
                entry("hadoop-common")
                entry("hadoop-hdfs")
                entry("hadoop-hdfs-client")
                entry("hadoop-mapreduce-client-core")
                entry("hadoop-yarn-api")
                entry("hadoop-yarn-client")
            }

            // HBase dependencies
            dependencySet(group:"org.apache.hbase", version:"${hbaseVersion}") {
                entry("hbase-annotations")
                entry("hbase-client")
                entry("hbase-common")
                entry("hbase-protocol")
                entry("hbase-protocol-shaded")
            }

            // Hive dependencies
            dependency("org.apache.hive:hive-storage-api:${hiveStorageApiVersion}")
            dependencySet(group:"org.apache.hive", version:"${hiveVersion}") {
                entry("hive-exec")
                entry("hive-metastore")
                entry("hive-serde")
                entry("hive-common")
                // On modern Hive lines the metastore thrift client and the
                // HiveServer2 RPC types live in their own artifacts (split
                // upstream in Hive 3.0 and 2.1 respectively; new to this
                // block because it was derived from Hive 2.3.8)
                entry("hive-standalone-metastore-common")
                entry("hive-service-rpc")
                entry("hive-classification")
                // UDF base classes (UDFArgumentException etc.) split out of
                // hive-exec in Hive 4.x
                entry("hive-udf")
            }
            // hive-jdbc/hive-service move with the Hive line: they share the
            // libthrift pin, and hive-jdbc 2.x-3.x still needs the thrift 0.9
            // API, so there is no halfway version once libthrift is 0.16
            dependencySet(group:"org.apache.hive", version:"${hiveVersion}") {
                entry("hive-jdbc")
                entry("hive-service")
            }
            dependencySet(group:"org.apache.hive.shims", version:"${hiveVersion}") {
                entry("hive-shims-common")
                entry("hive-shims-0.23")
            }
            // hive-jdbc 4.x references Apache Curator while PARSING any
            // jdbc:hive2 URL (Utils.extractURLComponents loads a
            // curator-typed helper even when ZooKeeper service discovery is
            // not requested), so the driver is unusable without these.
            // 5.2.0 is what apache-hive-4.0.1-bin ships in lib/.
            dependencySet(group:"org.apache.curator", version:"5.2.0") {
                entry("curator-client")
                entry("curator-framework")
                entry("curator-recipes")
            }

            // Parquet dependencies
            dependency("org.apache.parquet:parquet-format:2.7.0")
            dependencySet(group:"org.apache.parquet", version:"${parquetVersion}") {
                entry("parquet-column")
                entry("parquet-common")
                entry("parquet-encoding")
                entry("parquet-generator")
                entry("parquet-hadoop")
                entry("parquet-jackson")
                entry("parquet-pig")
            }

            // Thrift dependencies: libthrift per Hive 4.0.1's POM; libfb303's
            // line ended at 0.9.3 and Hive 4.0.1 itself still pins it there
            dependency("org.apache.thrift:libthrift:0.16.0")
            dependency("org.apache.thrift:libfb303:0.9.3")

            // ORC dependencies
            dependencySet(group:"org.apache.orc", version:"${orcVersion}") {
                entry("orc-core")
                entry("orc-shims")
            }

            // Avro dependencies. 1.11.4 carries BDSA-2026-2029 (8.1 high:
            // remote code execution via code injection in the Java SDK);
            // Black Duck puts the 1.11.x fix at 1.11.5, which is on Maven
            // Central. Deliberately staying on the 1.11 line: avro 1.12.x
            // is compiled for Java 11 (class-file major 55) while 1.11.5 is
            // still Java 8 (major 52), and this build targets Java 8. The
            // 1.11.5 POM declares the same dependencies as 1.11.4, so
            // nothing else in the tree moves with it.
            dependencySet(group:"org.apache.avro", version:"1.11.5") {
                entry("avro")
                entry("avro-mapred")
            }

            // AWS SDK dependencies
            dependencySet(group:"com.amazonaws", version:"${awsJavaSdk}") {
                entry("aws-java-sdk-core")
                entry("aws-java-sdk-kms")
                entry("aws-java-sdk-s3")
            }

            // log4j-spring-boot needs no entry here: it is part of log4j-bom
            // and so tracks the log4j2.version override at the top of this
            // file. The JUnit excludes that used to live here are gone with
            // it -- log4j-spring-boot:2.17.2 declared junit-vintage-engine,
            // junit-jupiter-engine, junit-jupiter-api and junit-pioneer at
            // COMPILE scope, which leaked them onto compileClasspath and into
            // the shipped jar. That was fixed upstream in 2.19.0 (the previous
            // comment here anticipated exactly this cleanup); at 2.26.0 every
            // JUnit dependency is test-scoped.

        }
    }

    task removeIdeaOutDirectory(type: Delete) {
        file("${projectDir}/out").deleteDir()
    }

    clean {
        dependsOn(removeIdeaOutDirectory)
    }

    compileJava {
        options.compilerArgs += [
                "-g", "-Xlint:varargs", "-Xlint:cast", "-Xlint:classfile", "-Xlint:dep-ann", "-Xlint:divzero",
                "-Xlint:empty", "-Xlint:finally", "-Xlint:overrides", "-Xlint:path", "-Xlint:-processing", "-Xlint:static",
                "-Xlint:try", "-Xlint:fallthrough", "-Xlint:deprecation", "-Xlint:unchecked", "-Xlint:-options", "-Werror"
        ]
    }

    compileTestJava {
        options.compilerArgs += [
                "-g", "-Xlint:varargs", "-Xlint:cast", "-Xlint:classfile", "-Xlint:dep-ann", "-Xlint:divzero",
                "-Xlint:empty", "-Xlint:finally", "-Xlint:overrides", "-Xlint:path", "-Xlint:-processing", "-Xlint:static",
                "-Xlint:try", "-Xlint:fallthrough", "-Xlint:deprecation", "-Xlint:unchecked", "-Xlint:-options", "-Werror"
        ]
    }

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }

        // create a full list of dependencies shipped with PXF to make sure we give proper attribution
        licenseScanner {
            extendsFrom runtimeClasspath
            // runtimeClasspath includes development-only dependencies, explicitly exclude them here
            exclude group: 'org.springframework.boot', module: 'spring-boot-devtools'
            exclude group: 'com.fasterxml.jackson', module: 'jackson-bom'
            // some dependencies shipped with PXF were not automatically included, include them here
            dependencies {
                // declare the dependency spring-boot-loader in the scope of the license scanner configuration
                // https://docs.gradle.org/current/userguide/declaring_dependencies.html#sec:resolvable-consumable-configs
                licenseScanner('org.springframework.boot:spring-boot-loader')
            }
        }

        all*.exclude group: 'javax.servlet', module: 'servlet-api'
        all*.exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
        all*.exclude group: 'org.slf4j', module: 'slf4j-log4j12'
        all*.exclude group: 'org.codehaus.jackson', module: 'jackson-core-asl'
        all*.exclude group: 'org.codehaus.jackson', module: 'jackson-mapper-asl'
        // commons-lang 2.x is end-of-life with an unfixed advisory; PXF's own
        // code is entirely on commons-lang3 now. Several Hive and Hadoop
        // artifacts still declare it, so without this it returns to the
        // bundle through the first dependency declared without
        // transitive = false.
        all*.exclude group: 'commons-lang', module: 'commons-lang'
    }

    test {
        // Optionally run tests on a different JVM than the (JDK 8) build JVM.
        // PXF supports running on Java 8 or Java 11; this lets CI exercise
        // the tests on the newer supported runtime too:
        //   ./gradlew test -PtestJvm=/path/to/jdk
        if (project.hasProperty('testJvm')) {
            executable = "${project.property('testJvm')}/bin/java"
        }

        testLogging {
            // log test names only when failed
            events "failed"
        }

        // slightly modified from https://stackoverflow.com/a/36130467
        afterSuite { desc, result ->
            if (!desc.parent) { // print only for the entire sub project not per test suite
                def suiteSummary = "${project.name} Test Results: ${result.resultType} " +
                        "(${result.testCount} tests, " +
                        "${result.successfulTestCount} passed, " +
                        "${result.failedTestCount} failed, " +
                        "${result.skippedTestCount} skipped)"
                printResults(suiteSummary)

                // add results to combined total
                totalTests += result.testCount
                totalSuccesses += result.successfulTestCount
                totalFailures += result.failedTestCount
                totalSkipped += result.skippedTestCount
            }
        }
    }
}

// used for test statistics
ext {
    totalTests = 0L
    totalSuccesses = 0L
    totalFailures = 0L
    totalSkipped = 0L
}

gradle.buildFinished {
    def combinedSummary = "Total Results: " +
            "${totalTests} tests, " +
            "${totalSuccesses} passed, " +
            "${totalFailures} failed, " +
            "${totalSkipped} skipped"
    printResults(combinedSummary)
}

private static void printResults(result) {
    def startItem = '│ ', endItem = ' │'
    def repeatLength = startItem.length() + result.length() + endItem.length() - 2
    println('\n' + '┌' + ('-' * repeatLength) + '┐' +
            '\n' + startItem + result + endItem +
            '\n' + '└' + ('-' * repeatLength) + '┘')
}

task stage(type: Copy) {
    description "Build PXF server and stage resulting artifacts for packaging."
    dependsOn ":pxf-service:bootJar"

    // Provide the pxf-hbase jar. The pxf-hbase.jar is required for the PXF
    // HBase connector to support filter push down
    from("pxf-hbase/build/libs") { into 'share' }
    from("pxf-service/build/libs") {
        into 'application'
        rename 'pxf-service-(.+)', 'pxf-app-$1'
    }
    from('pxf-service/src/scripts/') {
        include 'pxf'
        include 'kill-pxf.sh'
        include 'merge-pxf-config.sh'
        include 'pxf-pre-gpupgrade'
        include 'pxf-post-gpupgrade'
        into 'bin'
        filter { line -> line.replaceAll('_PXF_VERSION_', "${version}") }
    }
    from('pxf-service/src/templates')
    into "$buildDir/stage"

    doLast { new File("${buildDir}/stage/version").text = "${version}\n" }
}
